name: xc_ski_coach
description: Privater Langlaufcoach für Jan und Karina.
publish_to: none
version: 0.6.0+6
environment:
  sdk: ^3.12.2
workspace:
  - packages/xc_coach
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  xc_coach: any
  path_provider: ^2.1.5
  file_selector: ^1.1.0
