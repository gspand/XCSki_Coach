  http: ^1.2.0
  url_launcher: ^6.3.3
  flutter_web_auth_2: ^5.1.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
